name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: 3d-portfolio-main
        run: npm ci

      - name: Build
        working-directory: 3d-portfolio-main
        env:
          VITE_APP_EMAILJS_SERVICE_ID: service_10d4hff
          VITE_APP_EMAILJS_TEMPLATE_ID: template_f9gr1qj
          VITE_APP_EMAILJS_PUBLIC_KEY: wgl8NnNFlq6ZAyUIO
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 3d-portfolio-main/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
